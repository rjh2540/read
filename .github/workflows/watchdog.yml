name: wxread watchdog

# 自动检测：定时检查微信读书阅读任务有没有真的跑成功；没有运行或运行失败，就自动补跑一次。
# 检查时间就是下面 schedule 里的 cron（按 UTC 计），也可以打开控制台页面
# 「计划与通知」→「自动检测」直接设置，保存后会自动更新本文件。
# 自动检查时间：每天北京时间 12:07（cron 按 UTC 执行，北京时间 = UTC + 8）。
# 关闭自动检测会把下面两行整体注释掉；保持注释状态即可，请勿只删掉 cron 一行。
on:
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

run-name: 'wxread-watchdog'

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install --disable-pip-version-check -r requirements-actions.txt
      - name: Check scheduled reading run
        env:
          GH_TOKEN: ${{ github.token }}
          WXREAD_CONTROL_KEY: ${{ secrets.WXREAD_CONTROL_KEY }}
          WXREAD_ACCOUNTS_JSON: ${{ secrets.WXREAD_ACCOUNTS_JSON }}
          WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
          PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
          WEBHOOK_TYPE: ${{ vars.WEBHOOK_TYPE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python watchdog.py
